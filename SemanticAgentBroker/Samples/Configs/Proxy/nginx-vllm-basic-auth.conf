# ==============================================================================
# Nginx Reverse Proxy Configuration for vLLM with HTTP Basic Authentication
# ==============================================================================
# This configuration fronts a vLLM inference instance and enforces HTTP Basic
# Authentication (username/password), while optimizing proxy settings for long-lived
# Server-Sent Events (SSE) token streaming and high-concurrency LLM inference.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    # Upstream vLLM Service (internal Docker network or localhost)
    upstream vllm_backend {
        server vllm:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # ----------------------------------------------------------------------
        # HTTP Basic Authentication
        # ----------------------------------------------------------------------
        # Requires user/password generated via apache2-utils (htpasswd):
        # command: htpasswd -bc /etc/nginx/.htpasswd agent_user SecretAgentPassword123!
        # ----------------------------------------------------------------------
        auth_basic "Protected vLLM AI Inference Service";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # ----------------------------------------------------------------------
        # Optional: Public Health Check Endpoint (Bypass Basic Auth if needed)
        # Uncomment below if you want load balancers to probe health without credentials
        # ----------------------------------------------------------------------
        # location /health {
        #     auth_basic off;
        #     proxy_pass http://vllm_backend/health;
        # }

        # ----------------------------------------------------------------------
        # Main Proxy Route for OpenAI-Compatible API (/v1/...)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://vllm_backend;

            # HTTP 1.1 + Keepalive connection to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Client & Host Header Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # ------------------------------------------------------------------
            # CRITICAL: Streaming & Timeout Settings for LLM Inference
            # ------------------------------------------------------------------
            # Disable buffering so tokens stream immediately to SemanticAgentBroker
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;     # Large models / slow tokens can take minutes
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Chunked Transfer Encoding Support
            chunked_transfer_encoding on;

            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
    }
}
